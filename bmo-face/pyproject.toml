[project]
name = "bmo-face"
version = "0.1.0"
description = "La faccia di BMO: pipeline asset, renderer, socket verso bmo-core (issue #23)"
requires-python = ">=3.11"
# Pillow: unica dipendenza vera per pipeline e renderer (RGB565, disegno del
# placeholder, testo del timer). GTK4/PyGObject (la finestra a schermo) resta
# fuori da questa lista: è un pacchetto di sistema (Arch: python-gobject,
# gtk4), non pip-installabile in modo affidabile, e serve solo sul PC di
# sviluppo — il Pi non aprirà mai una finestra. L'extra "finestra" qui sotto
# è solo un promemoria di quella dipendenza esterna; il modulo che la importa
# lo fa in modo lazy (import dentro la funzione), così il resto del pacchetto
# (pipeline, renderer, server socket) resta usabile anche senza GTK.
dependencies = ["pillow", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]
finestra = []  # promemoria: richiede GTK4 + PyGObject di sistema, vedi sopra

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmo_face"]

[project]
name = "bmo-core"
version = "0.1.0"
description = "Logica di dialogo e adapter hardware per l'assistente BMO"
requires-python = ">=3.11"
# ddgs: la ricerca sul web (§2.4), perché il grounding con Google Search non è
# nel free tier. Importata dove serve, così BMO parte anche senza.
# webrtcvad-wheels: rilevamento del silenzio per capire da soli quando finisce
# una frase (§2.1), invece di registrare per una durata fissa. Stesso modulo
# importabile (`import webrtcvad`) del pacchetto originale `webrtcvad`, ma
# senza il suo `import pkg_resources` all'avvio: quello viene da setuptools,
# che lo sta rimuovendo (rotto qui con setuptools 84). È comunque
# un'estensione C: si compila da sorgente su Python 3.14 (verificato), ma sul
# Pi servirà una toolchain di compilazione, come già per onnxruntime (§2.6).
# edge-tts: la voce di BMO (#42). È un client **non ufficiale** dell'endpoint
# di lettura di Microsoft Edge: nessuna quota documentata, nessun permesso
# d'uso da terze parti, e si è già rotto in passato. Scelto perché sintetizza
# in ~0,6 s contro i ~2,6 s di Gemini e non ha il limite di 3 richieste al
# minuto. Se un giorno BMO ammutolisce, è il primo sospetto: il ripiego
# previsto è Azure Speech, che serve **la stessa voce** `it-IT-DiegoNeural`
# ufficialmente.
dependencies = ["google-genai", "ddgs", "webrtcvad-wheels", "edge-tts"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmo_core"]
